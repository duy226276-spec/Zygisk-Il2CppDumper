name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name of the game:'
        required: true
        default: 'com.dts.freefireth'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Game Package Name
        run: |
          PKG="${{ github.event.inputs.package_name }}"
          [ -z "$PKG" ] && PKG="com.dts.freefireth"
          cat <<EOF > module/src/main/cpp/game.h
          #ifndef ZYGISK_IL2CPPDUMPER_GAME_H
          #define ZYGISK_IL2CPPDUMPER_GAME_H

          #define GamePackageName "$PKG"

          #endif //ZYGISK_IL2CPPDUMPER_GAME_H
          EOF
          cat module/src/main/cpp/game.h

      - name: Build Module
        run: |
          chmod +x gradlew
          ./gradlew :module:assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper-release
          path: |
            out/*.zip
            module/build/outputs/**/*.zip
          if-no-files-found: error
